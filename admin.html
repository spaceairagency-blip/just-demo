<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Firebase Control</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .admin-container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; padding: 40px; }
        h1 { color: #333; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-view { display: block; }
        .admin-view { display: none; }
        .current-data { background: #f8f9fa; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div id="loginView" class="login-view">
            <h1>🔐 Admin Login</h1>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPass" placeholder="Default: Eid@2026">
            </div>
            <button onclick="checkLogin()">Login</button>
        </div>

        <div id="adminView" class="admin-view">
            <h1>⚙️ Manage Celebration</h1>
            <div class="current-data">
                <p>Current Title: <b id="currTitle">...</b></p>
                <p>Current Time: <b id="currTime">...</b></p>
            </div>
            <div class="form-group">
                <label>New Name</label>
                <input type="text" id="newName" placeholder="e.g. Eid Ul Adha">
            </div>
            <div class="form-group">
                <label>New Date & Time</label>
                <input type="datetime-local" id="newTime">
            </div>
            <button onclick="saveToFirebase()">Update Celebration</button>
            <button style="background: #f0f0f0; color: #333;" onclick="location.reload()">Logout</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHj7I-hjgLzjn_6Q990SjwIY6oAoJa-lI",
            authDomain: "rent-management-system-224df.firebaseapp.com",
            projectId: "rent-management-system-224df",
            databaseURL: "https://rent-management-system-224df-default-rtdb.firebaseio.com/", // Updated to use RTDB
            storageBucket: "rent-management-system-224df.firebasestorage.app",
            messagingSenderId: "1077553959193",
            appId: "1:1077553959193:web:3b72cddee4e561ba3df588"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Login Logic
        window.checkLogin = function() {
            const pass = document.getElementById('adminPass').value;
            if(pass === "Eid@2026") {
                document.getElementById('loginView').style.display = 'none';
                document.getElementById('adminView').style.display = 'block';
                loadData();
            } else { alert("Wrong Password!"); }
        }

        // Load Data
        function loadData() {
            onValue(ref(db, 'celebration'), (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    document.getElementById('currTitle').innerText = data.name;
                    document.getElementById('currTime').innerText = new Date(data.date).toLocaleString();
                }
            });
        }

        // Save Data
        window.saveToFirebase = function() {
            const name = document.getElementById('newName').value;
            const time = document.getElementById('newTime').value;
            if(!name || !time) return alert("Fill all fields");

            set(ref(db, 'celebration'), {
                name: name,
                date: time
            }).then(() => alert("Saved Successfully!"));
        }
    </script>
</body>
</html>

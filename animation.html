<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NCSI Video Call Popup</title>
    <style>
        body { 
            background: #0f0f0f; 
            color: white; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .dashboard {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
        }
        h1 { color: #ffcc00; letter-spacing: 2px; }
        .trigger-btn {
            background: #ffcc00;
            color: black;
            border: none;
            padding: 15px 40px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
        }
        .trigger-btn:hover { box-shadow: 0 0 25px #ffcc00; transform: translateY(-2px); }
        video { display: none; } /* Master video source */
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>NCSI CALL ENGINE</h1>
        <p>Click to launch the Video Popup on top of Chrome.</p>
        <button class="trigger-btn" onclick="openVideoPopup()">FOUND CALL (VIDEO)</button>
    </div>

    <video id="callVideo" loop crossorigin="anonymous">
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>

    <script>
        async function openVideoPopup() {
            const video = document.getElementById('callVideo');
            
            try {
                // 1. Play the video hidden in the background
                await video.play();

                // 2. Trigger the "Picture-in-Picture" Mode
                // This forces the video into a floating, native OS window 
                // that stays on top of every other app on your Asus VivoBook.
                if (document.pictureInPictureEnabled) {
                    await video.requestPictureInPicture();
                } else {
                    alert("Your browser does not support native video popups.");
                }

            } catch (error) {
                console.error(error);
                alert("SIR, please click the button again to allow the video popup.");
            }
        }
        
        // Listen for when the popup is closed
        video.addEventListener('leavepictureinpicture', () => {
            video.pause();
        });
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Subscriber Count</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 400px;
        }

        h1 {
            font-size: 1.2rem;
            color: #aaaaaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        #sub-count {
            font-size: 5rem;
            font-weight: bold;
            margin: 0;
            transition: all 0.3s ease;
        }

        .channel-name {
            color: #ff0000;
            font-size: 1.5rem;
            margin-top: 10px;
            display: block;
        }

        .status {
            font-size: 0.8rem;
            color: #4caf50;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="channel-name" id="name">Loading...</span>
        <h1>Subscribers</h1>
        <p id="sub-count">0</p>
        <div class="status">● Live Updates</div>
    </div>

    <script>
        // REPLACE THIS WITH YOUR CHANNEL ID
        // You can find it in your YouTube URL (starts with UC...)
        const CHANNEL_ID = 'UC5I7O-y8H3mO7_I6_F0g0Pw '; 

        async function updateSubs() {
            try {
                // Using a third-party public API that scrapes YT data
                const response = await fetch(`https://api.subscribercount.nz/stream/${CHANNEL_ID}`);
                const data = await response.json();

                if (data && data.subCount !== undefined) {
                    document.getElementById('sub-count').innerText = data.subCount.toLocaleString();
                    document.getElementById('name').innerText = data.channelName || "Channel";
                }
            } catch (error) {
                console.error("Error fetching data:", error);
                document.getElementById('sub-count').innerText = "Error";
            }
        }

        // Update every 5 seconds
        setInterval(updateSubs, 5000);
        
        // Initial call
        updateSubs();
    </script>
</body>
</html>

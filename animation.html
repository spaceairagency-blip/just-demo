<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        body { background: #1a0533; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { font-size: 3rem; margin-bottom: 20px; color: #ffd700; }
        .timer { display: flex; gap: 20px; }
        .box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; min-width: 80px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        .num { font-size: 2.5rem; font-weight: bold; display: block; }
        .label { font-size: 0.8rem; opacity: 0.7; text-transform: uppercase; }
        .btn { margin-top: 40px; padding: 15px 40px; background: #ffd700; color: #1a0533; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1 id="eventTitle">Loading...</h1>

    <div class="timer">
        <div class="box"><span class="num" id="d">00</span><span class="label">Days</span></div>
        <div class="box"><span class="num" id="h">00</span><span class="label">Hours</span></div>
        <div class="box"><span class="num" id="m">00</span><span class="label">Mins</span></div>
        <div class="box"><span class="num" id="s">00</span><span class="label">Secs</span></div>
    </div>

    <button class="btn" id="startBtn" onclick="window.location.href='home.html'" disabled>Start Celebration</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHj7I-hjgLzjn_6Q990SjwIY6oAoJa-lI",
            authDomain: "rent-management-system-224df.firebaseapp.com",
            projectId: "rent-management-system-224df",
            databaseURL: "https://rent-management-system-224df-default-rtdb.firebaseio.com/",
            appId: "1:1077553959193:web:3b72cddee4e561ba3df588"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let targetDate = new Date();

        onValue(ref(db, 'celebration'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                targetDate = new Date(data.date);
                document.getElementById('eventTitle').innerText = data.name;
            }
        });

        function update() {
            const diff = targetDate - new Date();
            const btn = document.getElementById('startBtn');
            if(diff <= 0) {
                btn.disabled = false;
                return;
            }
            document.getElementById('d').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
            document.getElementById('h').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
            document.getElementById('m').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            document.getElementById('s').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        }
        setInterval(update, 1000);
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Error</title>
    <style>
        :root {
            --ios-gray: #8e8e93;
            --ios-blue: #007aff;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        /* Fake Dead Pixel Prank */
        .dead-pixel {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #ff0000;
            top: 25%;
            left: 40%;
            z-index: 9999;
            box-shadow: 0 0 2px #ff0000;
        }

        /* Low Battery Icon */
        .battery-container {
            width: 120px;
            height: 50px;
            border: 4px solid #fff;
            border-radius: 10px;
            position: relative;
            padding: 4px;
            margin-bottom: 20px;
        }
        .battery-container::after {
            content: '';
            position: absolute;
            right: -12px;
            top: 12px;
            width: 8px;
            height: 20px;
            background: #fff;
            border-radius: 0 4px 4px 0;
        }
        .battery-level {
            width: 5%;
            height: 100%;
            background-color: #ff3b30; /* Critical Red */
            border-radius: 4px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Fake System Alert */
        .alert-box {
            background: rgba(255, 255, 255, 0.9);
            color: black;
            width: 80%;
            max-width: 300px;
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: block;
        }
        .alert-title {
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .alert-msg {
            font-size: 14px;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .alert-btn {
            color: var(--ios-blue);
            font-weight: 600;
            font-size: 17px;
            border-top: 1px solid #ccc;
            padding-top: 15px;
            width: 100%;
            display: block;
            text-decoration: none;
        }

        /* Brightness "Dimming" effect */
        .dimmer {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 500;
        }

        #hidden-message {
            display: none;
            color: #444;
            font-size: 10px;
            margin-top: 50px;
        }
    </style>
</head>
<body onclick="shakePhone()">

    <div class="dead-pixel"></div>
    
    <div class="dimmer"></div>

    <div class="battery-container">
        <div class="battery-level"></div>
    </div>

    <div class="alert-box" id="main-alert">
        <div class="alert-title">Low Battery</div>
        <div class="alert-msg">
            Battery level has dropped to 1%. System will shut down unless a charger is connected immediately.
        </div>
        <div class="alert-btn" onclick="scareUser()">Close</div>
    </div>

    <div id="hidden-message">You've been pranked. There is no charger.</div>

    <script>
        // Trigger vibration on click (if supported)
        function scareUser() {
            if ("vibrate" in navigator) {
                navigator.vibrate([100, 50, 100, 50, 300]);
            }
            
            const alertBox = document.getElementById('main-alert');
            alertBox.style.display = 'none';
            
            // Show the "Dark Screen"
            document.body.style.backgroundColor = "black";
            
            setTimeout(() => {
                alert("ERROR: System.Energy.Critical - Shutdown failed successfully.");
                document.getElementById('hidden-message').style.display = 'block';
            }, 1000);
        }

        function shakePhone() {
             if ("vibrate" in navigator) {
                navigator.vibrate(50);
            }
        }

        // Prevent typical mobile behavior to make it feel like a frozen OS
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>

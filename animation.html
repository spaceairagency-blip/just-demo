<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uber Style Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { --uber-blue: #276EF1; --dark: #000; --green: #2ecc71; --red: #e74c3c; --orange: #f39c12; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Arial', sans-serif; background: #000; }

        .dashboard {
            position: absolute; top: 10px; left: 10px; right: 10px;
            background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 16px;
            z-index: 1000; display: flex; flex-wrap: wrap; gap: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(4px);
        }
        .stat-item { flex: 1; text-align: center; min-width: 60px; }
        .stat-val { font-size: 20px; font-weight: 900; color: var(--dark); }
        .stat-unit { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        #weather-box { width: 100%; text-align: center; font-size: 11px; font-weight: bold; color: var(--uber-blue); border-top: 1px solid #eee; padding-top: 8px; margin-top: 5px; }

        .controls {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 1000;
        }

        .btn {
            width: 60px; height: 60px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer;
        }
        .start-btn { background: var(--green); color: white; font-size: 24px; }
        .stop-btn { background: var(--red); color: white; font-size: 24px; }
        .recenter-btn { background: white; color: var(--uber-blue); font-size: 22px; }

        #map { width: 100%; height: 100vh; }
        .car-marker { transition: transform 0.3s linear; }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="stat-item">
            <div id="speed-num" class="stat-val">0</div>
            <div class="stat-unit">km/h</div>
        </div>
        <div class="stat-item">
            <div id="timer-val" class="stat-val">00:00</div>
            <div class="stat-unit">Time</div>
        </div>
        <div class="stat-item">
            <div id="dist-val" class="stat-val">0.00</div>
            <div class="stat-unit">Distance</div>
        </div>
        <div id="weather-box"><i class="fas fa-sun"></i> Waiting for GPS...</div>
    </div>

    <div id="map"></div>

    <div class="controls">
        <button id="main-btn" class="btn start-btn" onclick="toggleTracking()"><i class="fas fa-play"></i></button>
        <button class="btn recenter-btn" onclick="recenterMap()"><i class="fas fa-location-arrow"></i></button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = "8bc7e583c218683e33b93f18e5904031"; // Validated OpenWeather Key
        let isTracking = false, startTime, timerInterval, totalDist = 0;
        let lastPos = null, carMarker = null, isUserMoving = false;

        const map = L.map('map', { zoomControl: false }).setView([23.95, 90.26], 15);
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        function toggleTracking() {
            const btn = document.getElementById('main-btn');
            if (!isTracking) {
                isTracking = true;
                startTime = new Date();
                btn.innerHTML = '<i class="fas fa-stop"></i>';
                btn.className = 'btn stop-btn';
                startTimer();
                navigator.geolocation.watchPosition(updatePos, null, { enableHighAccuracy: true });
            } else {
                location.reload();
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                const diff = new Date(new Date() - startTime);
                document.getElementById('timer-val').innerText = 
                    `${String(diff.getUTCMinutes()).padStart(2, '0')}:${String(diff.getUTCSeconds()).padStart(2, '0')}`;
            }, 1000);
        }

        async function updateWeather(lat, lon) {
            try {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`);
                const data = await res.json();
                document.getElementById('weather-box').innerHTML = 
                    `<i class="fas fa-cloud"></i> ${data.weather[0].main} | <i class="fas fa-temperature-high"></i> ${Math.round(data.main.temp)}°C`;
            } catch (e) { console.log("Weather Error"); }
        }

        function updatePos(pos) {
            if (!isTracking) return;
            const { latitude, longitude, speed, heading } = pos.coords;
            const currentPos = [latitude, longitude];
            const currentSpeed = (speed || 0) * 3.6;

            document.getElementById('speed-num').innerText = Math.round(currentSpeed);
            updateWeather(latitude, longitude);

            // Uber Car Icon with Rotation
            const carIcon = L.divIcon({
                className: 'car-marker',
                html: `<i class="fas fa-car" style="font-size: 28px; color: black; transform: rotate(${heading || 0}deg); text-shadow: 0 0 5px white;"></i>`,
                iconSize: [30, 30], iconAnchor: [15, 15]
            });

            if (!carMarker) {
                carMarker = L.marker(currentPos, { icon: carIcon }).addTo(map);
            } else {
                carMarker.setLatLng(currentPos).setIcon(carIcon);
            }

            // Traffic Line Logic
            if (lastPos) {
                const d = calculateDistance(lastPos[0], lastPos[1], latitude, longitude);
                totalDist += d;
                document.getElementById('dist-val').innerText = totalDist.toFixed(2);

                let color = 'var(--green)';
                if (currentSpeed < 10) color = 'var(--red)';
                else if (currentSpeed < 25) color = 'var(--orange)';

                L.polyline([lastPos, currentPos], { color: color, weight: 7, opacity: 0.9 }).addTo(map);
            }

            if (!isUserMoving) map.panTo(currentPos);
            lastPos = currentPos;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function recenterMap() { isUserMoving = false; if (lastPos) map.flyTo(lastPos, 18); }
        map.on('movestart', () => isUserMoving = true);
    </script>
</body>
</html>

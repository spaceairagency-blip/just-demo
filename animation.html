
<!DOCTYPE html>
<html lang="en">
<head><script type="text/javascript" src="/___vscode_livepreview_injected_script"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCSI Call System</title>
    <style>
        :root {
            --gold: #ffcc00;
            --glass: rgba(255, 255, 255, 0.1);
            --bg: #0f0f0f;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism Container */
        .container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            width: 350px;
        }

        h1 {
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .btn {
            background: transparent;
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 15px var(--gold);
        }

        .status {
            margin-top: 15px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NCSI Call System</h1>
        <p>This tool triggers a system-level popup notification that appears over other windows.</p>
        
        <button class="btn" onclick="requestPermission()">Enable Notifications</button>
        <button class="btn" onclick="simulateIncomingCall()">Test Incoming Call</button>
        
        <div id="status" class="status">Status: Waiting for permission...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');

        // 1. Request Permission from the user
        function requestPermission() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notifications.");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    statusDiv.innerText = "Status: Ready to receive calls!";
                    statusDiv.style.color = "#00ff00";
                } else {
                    statusDiv.innerText = "Status: Permission Denied.";
                    statusDiv.style.color = "#ff4444";
                }
            });
        }

        // 2. Function to show the notification (The "Popup")
        function simulateIncomingCall() {
            if (Notification.permission === "granted") {
                const options = {
                    body: "Incoming Video Call from Lopa Yeasmin",
                    icon: "https://cdn-icons-png.flaticon.com/512/3059/3059518.png", // Call icon
                    silent: false,
                    requireInteraction: true, // Keeps it on screen until user clicks it
                    tag: "call-notify" // Prevents multiple popups from stacking
                };

                const notification = new Notification("NCSI CALL FOUND", options);

                // When user clicks the notification
                notification.onclick = function(event) {
                    event.preventDefault();
                    window.focus(); // Brings Chrome back to the front
                    alert("Connecting to the call...");
                    notification.close();
                };

            } else {
                alert("Please click 'Enable Notifications' first, SIR.");
            }
        }
    </script>
</body>
</html>

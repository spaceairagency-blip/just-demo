<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebration Countdown</title>
    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #1a0533 0%, #4a148c 100%); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; overflow: hidden; }
        #stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; width: 2px; height: 2px; animation: twinkle 3s infinite; }
        header h1 { font-size: 48px; margin-bottom: 10px; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .countdown-boxes { display: flex; gap: 15px; margin: 30px 0; }
        .cd-box { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); padding: 15px; border-radius: 12px; min-width: 90px; }
        .cd-value { font-size: 36px; font-weight: bold; display: block; color: #ffd700; }
        .cd-label { font-size: 12px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        .start-btn { padding: 15px 40px; font-size: 18px; background: #ffd700; color: #1a0533; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 0 20px rgba(255,215,0,0.2); transition: 0.3s; }
        .start-btn:disabled { background: #444; color: #777; cursor: not-allowed; box-shadow: none; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="stars"></div>
    <header>
        <h1 id="mainTitle">Loading...</h1>
        <p id="subtitle">Preparing the celebration</p>
    </header>

    <div class="countdown-boxes" id="timerDisplay">
        <div class="cd-box"><span class="cd-value" id="days">00</span><span class="cd-label">Days</span></div>
        <div class="cd-box"><span class="cd-value" id="hours">00</span><span class="cd-label">Hours</span></div>
        <div class="cd-box"><span class="cd-value" id="mins">00</span><span class="cd-label">Mins</span></div>
        <div class="cd-box"><span class="cd-value" id="secs">00</span><span class="cd-label">Secs</span></div>
    </div>

    <button class="start-btn" id="startBtn" onclick="window.location.href='home.html'" disabled>Start Celebration</button>

    <script>
        // Your specific GAS URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzr0PrJtnh2BvMV5SG4_q8p-QTmmomH0WB3TiJh8rEivTQpYgCZZ3Dt5jecHDafuQK2/exec";
        
        // Fallback date (May 27, 2026) in case server fails
        let targetDate = new Date(2026, 4, 27, 20, 30, 0);

        // Generate Background Stars
        const container = document.getElementById('stars');
        for(let i=0; i<70; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random()*100+'%';
            s.style.top = Math.random()*100+'%';
            s.style.animationDelay = Math.random()*3+'s';
            container.appendChild(s);
        }

        // FETCH DATA FROM GOOGLE
        async function syncFromAdmin() {
            try {
                // Use JSONP-like approach or standard fetch with redirect follow
                const res = await fetch(`${GAS_URL}?action=getTargetDate&t=${Date.now()}`);
                const data = await res.json();
                
                if (data && data.date) {
                    targetDate = new Date(data.date);
                    document.getElementById('mainTitle').innerText = data.name || "Eid Celebration";
                    document.getElementById('subtitle').innerText = "The countdown is live";
                }
            } catch (e) {
                console.error("Connection to Admin Panel failed.");
                document.getElementById('mainTitle').innerText = "Eid Ul Adha";
            }
        }

        // UPDATE THE VISUAL TIMER
        function updateTimer() {
            const now = new Date();
            const diff = targetDate - now;
            const btn = document.getElementById('startBtn');
            
            if (diff <= 0) {
                document.getElementById('timerDisplay').innerHTML = "<h2 style='color:#ffd700'>🌙 Eid Mubarak!</h2>";
                btn.disabled = false;
                return;
            }

            btn.disabled = true;
            document.getElementById('days').innerText = Math.floor(diff / 86400000).toString().padStart(2, '0');
            document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000).toString().padStart(2, '0');
            document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
            document.getElementById('secs').innerText = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
        }

        // Start
        syncFromAdmin().then(() => {
            updateTimer();
            setInterval(updateTimer, 1000);
        });
    </script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sub Counter - Rubi Zaman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --neon-green:  #39ff9a;
      --neon-blue:   #00c8ff;
      --bg-deep:     #050810;
      --bg-card:     rgba(10, 15, 30, 0.85);
      --border-glow: rgba(57, 255, 154, 0.25);
      --text-dim:    rgba(255,255,255,0.35);
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-deep);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(57,255,154,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,154,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    #bgCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .card {
      position: relative; z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 4px;
      padding: 52px 60px 44px;
      width: min(520px, 92vw);
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 0 60px rgba(57,255,154,0.06), 0 40px 80px rgba(0,0,0,0.7);
    }
    .card::before, .card::after {
      content: ''; position: absolute; width: 18px; height: 18px;
      border-color: var(--neon-green); border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    .brand {
      font-family: 'Orbitron', monospace; font-size: 10px; font-weight: 700;
      letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 18px;
    }
    .live-badge {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(255,60,60,0.4); background: rgba(255,40,40,0.12);
      border-radius: 2px; padding: 5px 16px; font-size: 11px; font-weight: 700;
      letter-spacing: 3px; color: #ff5f5f; margin-bottom: 28px; text-transform: uppercase;
    }
    .live-dot {
      width: 6px; height: 6px; background: #ff3333; border-radius: 50%;
      box-shadow: 0 0 6px #ff3333; animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    #count {
      font-family: 'Orbitron', monospace; font-size: 72px; font-weight: 900;
      letter-spacing: -2px; line-height: 1; display: block;
      color: var(--neon-green); text-shadow: 0 0 20px rgba(57,255,154,0.6);
      transition: transform 0.12s ease;
    }
    #count.bump { transform: scale(1.08); }
    #count.error { color: #ff5f5f; font-size: 24px; }
    .count-label { font-size: 10px; letter-spacing: 4px; color: var(--text-dim); text-transform: uppercase; margin-top: 10px; }
    #delta {
      display: inline-block; padding: 7px 22px; border-radius: 2px;
      font-size: 13px; font-weight: 700; margin: 20px 0 28px; transition: all 0.35s ease;
    }
    .neutral { background: rgba(255,255,255,0.05); color: var(--text-dim); }
    .gain { background: rgba(57,255,154,0.1); color: var(--neon-green); border: 1px solid var(--neon-green); }
    .bar-wrap { height: 2px; background: rgba(255,255,255,0.07); border-radius: 2px; overflow: hidden; }
    #pbar { height: 100%; width: 100%; background: var(--neon-green); transform-origin: left; transform: scaleX(1); }
  </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<div class="card">
  <div class="brand">Nabhans Crafts Ideas</div>
  <div class="live-badge"><div class="live-dot"></div>Live</div>
  <div id="channel-name" style="color:white; margin-bottom:10px; font-size:14px;">Loading...</div>
  <div class="count-wrap">
    <span id="count">——</span>
    <div class="count-label">subscribers</div>
  </div>
  <div id="delta" class="neutral">Initializing...</div>
  <div class="bar-wrap"><div id="pbar"></div></div>
</div>

<script>
/* ── CONFIG ── */
const CHANNEL_ID = 'UCV6XeVyyYqKettwhHXb7cbg';
const INTERVAL = 10000; // 10 seconds
let prevCount = null;

/* ── STARFIELD BACKGROUND ── */
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let w, h, stars = [];

function initStars() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
  stars = Array.from({length: 150}, () => ({
    x: Math.random() * w, y: Math.random() * h,
    r: Math.random() * 1.5, speed: Math.random() * 0.5 + 0.1
  }));
}

function drawStars() {
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = "#39ff9a";
  stars.forEach(s => {
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    s.y -= s.speed; if(s.y < 0) s.y = h;
  });
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', initStars);
initStars(); drawStars();

/* ── FETCH DATA (Direct from Livecounts.io via Proxy) ── */
async function fetchCount() {
  const proxy = "https://corsproxy.io/?";
  const target = `https://api.livecounts.io/youtube-live-subscriber-count/live/${CHANNEL_ID}`;
  
  try {
    const response = await fetch(proxy + encodeURIComponent(target));
    const data = await response.json();
    
    if (data && data.counts) {
      const count = data.counts[0];
      updateUI(count);
    }
  } catch (err) {
    document.getElementById('count').innerText = "OFFLINE";
    document.getElementById('count').classList.add('error');
    console.error("Fetch Error:", err);
  }
}

function updateUI(count) {
  const el = document.getElementById('count');
  const delta = document.getElementById('delta');
  
  el.innerText = count.toLocaleString();
  el.classList.remove('error');
  
  // Animation effect
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 200);

  if (prevCount !== null && count > prevCount) {
    delta.innerText = `▲ +${count - prevCount} gained`;
    delta.className = 'gain';
  } else if (prevCount === null) {
    delta.innerText = "Watching Live";
    delta.className = 'neutral';
  }
  
  prevCount = count;
  animateBar();
}

function animateBar() {
  const bar = document.getElementById('pbar');
  bar.style.transition = 'none';
  bar.style.transform = 'scaleX(1)';
  setTimeout(() => {
    bar.style.transition = `transform ${INTERVAL/1000}s linear`;
    bar.style.transform = 'scaleX(0)';
  }, 50);
}

// Start
fetchCount();
setInterval(fetchCount, INTERVAL);

</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sub Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --neon-green:  #39ff9a;
      --neon-blue:   #00c8ff;
      --neon-purple: #b347ff;
      --bg-deep:     #050810;
      --bg-card:     rgba(10, 15, 30, 0.85);
      --border-glow: rgba(57, 255, 154, 0.25);
      --text-dim:    rgba(255,255,255,0.35);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg-deep);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
    }

    /* ── GRID SCANLINES ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(rgba(57,255,154,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(57,255,154,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* ── CANVAS ── */
    #bgCanvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none;
    }

    /* ── CARD ── */
    .card {
      position: relative; z-index: 10;
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 4px;
      padding: 52px 60px 44px;
      width: min(520px, 92vw);
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(57,255,154,0.08) inset,
        0 0 60px rgba(57,255,154,0.06),
        0 40px 80px rgba(0,0,0,0.7);
    }

    /* corner decorations */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--neon-green);
      border-style: solid;
    }
    .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

    /* ── BRAND ── */
    .brand {
      font-family: 'Orbitron', monospace;
      font-size: 10px; font-weight: 700;
      letter-spacing: 4px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* ── LIVE BADGE ── */
    .live-badge {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(255,60,60,0.4);
      background: rgba(255,40,40,0.12);
      border-radius: 2px;
      padding: 5px 16px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 3px;
      color: #ff5f5f;
      margin-bottom: 28px;
      text-transform: uppercase;
    }
    .live-dot {
      width: 6px; height: 6px;
      background: #ff3333;
      border-radius: 50%;
      box-shadow: 0 0 6px #ff3333;
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* ── CHANNEL NAME ── */
    .channel-name {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    /* ── COUNT ── */
    .count-wrap { margin: 0 0 8px; position: relative; }

    #count {
      font-family: 'Orbitron', monospace;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
      display: block;
      color: var(--neon-green);
      text-shadow:
        0 0 20px rgba(57,255,154,0.6),
        0 0 60px rgba(57,255,154,0.25);
      transition: transform 0.12s ease;
    }
    #count.bump { transform: scale(1.05); }
    #count.error { color: #ff5f5f; font-size: 28px; text-shadow: none; letter-spacing: 1px; }

    .count-label {
      font-size: 10px; letter-spacing: 4px;
      color: var(--text-dim); text-transform: uppercase;
      margin-top: 10px;
    }

    /* ── DELTA ── */
    #delta {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 7px 22px;
      border-radius: 2px;
      font-size: 13px; font-weight: 700;
      letter-spacing: 1px;
      margin: 20px 0 28px;
      transition: all 0.35s ease;
      min-width: 120px;
    }
    #delta.neutral { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid rgba(255,255,255,0.08); }
    #delta.gain    { background: rgba(57,255,154,0.10); color: var(--neon-green); border: 1px solid rgba(57,255,154,0.3); text-shadow: 0 0 10px rgba(57,255,154,0.5); }
    #delta.loss    { background: rgba(255,80,80,0.10); color: #ff6b6b; border: 1px solid rgba(255,80,80,0.3); }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 28px;
    }
    .stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 2px;
      padding: 14px 8px;
    }
    .stat-val {
      font-family: 'Orbitron', monospace;
      font-size: 18px; font-weight: 700;
      color: #fff;
    }
    .stat-lbl {
      font-size: 9px; letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* ── PROGRESS BAR ── */
    .bar-wrap {
      height: 2px;
      background: rgba(255,255,255,0.07);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    #pbar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-blue));
      transform-origin: left;
      transform: scaleX(1);
      box-shadow: 0 0 8px rgba(57,255,154,0.6);
    }
    .bar-hint {
      font-size: 9px; letter-spacing: 2px;
      color: rgba(255,255,255,0.18);
      text-transform: uppercase;
    }

    /* ── TOASTS ── */
    #toasts {
      position: fixed; bottom: 24px; right: 24px;
      z-index: 9999;
      display: flex; flex-direction: column; gap: 10px;
      align-items: flex-end;
    }
    .toast {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px;
      border-radius: 3px;
      font-size: 13px; font-weight: 700;
      max-width: 280px;
      backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      animation: tin 0.35s cubic-bezier(0.34,1.56,0.64,1);
      cursor: pointer;
    }
    .toast.gain { background: rgba(10,30,20,0.95); border: 1px solid rgba(57,255,154,0.4); color: #7fffc4; }
    .toast.loss { background: rgba(30,10,10,0.95); border: 1px solid rgba(255,80,80,0.4); color: #ffaaaa; }
    .toast-icon { font-size: 20px; }
    .toast-title { font-size: 12px; letter-spacing: 0.5px; }
    .toast-body  { font-size: 11px; opacity: 0.7; font-weight: 400; }
    .toast.out { animation: tout 0.3s ease forwards; }
    @keyframes tin  { from{opacity:0;transform:translateX(50px)} to{opacity:1;transform:none} }
    @keyframes tout { from{opacity:1;transform:none} to{opacity:0;transform:translateX(50px)} }

    /* ── PARTICLES ── */
    .particle {
      position: fixed;
      font-family: 'Orbitron', monospace;
      font-size: 16px; font-weight: 700;
      pointer-events: none; z-index: 9998;
      animation: fup 1.5s ease-out forwards;
    }
    @keyframes fup { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-110px) scale(0.5)} }

    /* ── RIPPLE CANVAS ── */
    #ripCanvas { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>
<canvas id="ripCanvas"></canvas>

<div class="card">
  <div class="brand">Nabhans Crafts Ideas</div>
  <div class="live-badge"><div class="live-dot"></div>Live</div>
  <div class="channel-name">YouTube Subscriber Counter</div>
  <div class="count-wrap">
    <span id="count">——</span>
    <div class="count-label">subscribers</div>
  </div>
  <div id="delta" class="neutral">— initializing —</div>
  <div class="stats-row">
    <div class="stat"><div class="stat-val" id="s-peak">—</div><div class="stat-lbl">Session Peak</div></div>
    <div class="stat"><div class="stat-val" id="s-gain">+0</div><div class="stat-lbl">Gained</div></div>
    <div class="stat"><div class="stat-val" id="s-lost">−0</div><div class="stat-lbl">Lost</div></div>
  </div>
  <div class="bar-wrap"><div id="pbar"></div></div>
  <div class="bar-hint">Refreshes every 30s</div>
</div>

<div id="toasts"></div>

<script>
/* ── CONFIG ── */
const CHANNEL_ID = 'UCfhc2JtLUh_BPJW0boWvYGA';
const INTERVAL   = 30000;

/* ── STARFIELD ── */
const bgC = document.getElementById('bgCanvas');
const bgX = bgC.getContext('2d');
let W, H, stars = [];
const COLORS = ['#39ff9a','#00c8ff','#b347ff','#ffffff','#7fffd4'];

function resize() {
  W = bgC.width = window.innerWidth;
  H = bgC.height = window.innerHeight;
  stars = Array.from({length:220}, () => ({
    x: Math.random()*W, y: Math.random()*H,
    r: Math.random()*1.5+0.2,
    speed: Math.random()*0.3+0.04,
    op: Math.random()*0.6+0.1,
    tw: Math.random()*Math.PI*2,
    col: COLORS[Math.floor(Math.random()*COLORS.length)]
  }));
}

function drawStars() {
  bgX.clearRect(0,0,W,H);
  stars.forEach(s => {
    s.tw += 0.018;
    const a = s.op*(0.65+0.35*Math.sin(s.tw));
    bgX.beginPath(); bgX.arc(s.x,s.y,s.r,0,Math.PI*2);
    bgX.fillStyle = s.col; bgX.globalAlpha = a; bgX.fill();
    s.y -= s.speed;
    if (s.y < -4) { s.y = H+4; s.x = Math.random()*W; }
  });
  bgX.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', resize);
resize(); requestAnimationFrame(drawStars);

/* ── RIPPLES ── */
const ripC = document.getElementById('ripCanvas');
const ripX = ripC.getContext('2d');
let rips = [];

function resizeRip() { ripC.width=window.innerWidth; ripC.height=window.innerHeight; }
window.addEventListener('resize', resizeRip); resizeRip();

function addRipple(col) {
  rips.push({ x:window.innerWidth/2, y:window.innerHeight/2, r:0, a:0.4, col });
}

(function drawRip() {
  ripX.clearRect(0,0,ripC.width,ripC.height);
  rips = rips.filter(r => r.a > 0.008);
  rips.forEach(r => {
    r.r += 7; r.a *= 0.92;
    ripX.beginPath(); ripX.arc(r.x,r.y,r.r,0,Math.PI*2);
    ripX.strokeStyle = r.col; ripX.lineWidth = 1.5;
    ripX.globalAlpha = r.a; ripX.stroke(); ripX.globalAlpha = 1;
  });
  requestAnimationFrame(drawRip);
})();

/* ── PARTICLES ── */
function spawnParticle(diff) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.textContent = diff > 0 ? `+${diff}` : `${diff}`;
  p.style.color = diff > 0 ? '#39ff9a' : '#ff6b6b';
  p.style.left = (25 + Math.random()*50) + 'vw';
  p.style.bottom = (18 + Math.random()*22) + 'vh';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 1600);
}

/* ── TOASTS ── */
function toast(type, diff) {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icon  = type==='gain' ? '🎉' : '📉';
  const title = type==='gain' ? 'New Subscriber!' : 'Lost a Subscriber';
  const body  = type==='gain'
    ? `Gained ${Math.abs(diff)} subscriber${Math.abs(diff)>1?'s':''}!`
    : `Lost ${Math.abs(diff)} subscriber${Math.abs(diff)>1?'s':''}.`;
  t.innerHTML = `<div class="toast-icon">${icon}</div><div><div class="toast-title">${title}</div><div class="toast-body">${body}</div></div>`;

  const dismiss = () => { t.classList.add('out'); setTimeout(()=>t.remove(),320); };
  t.onclick = dismiss;
  c.appendChild(t);
  const timer = setTimeout(dismiss, 5000);

  if (Notification.permission==='granted') {
    new Notification(title, { body, icon:'https://www.youtube.com/favicon.ico' });
  }
}

if ('Notification' in window && Notification.permission==='default') Notification.requestPermission();

/* ── STATE ── */
let prev=null, gained=0, lost=0, peak=null;
const fmt = n => Number(n).toLocaleString();

function updateUI(count) {
  const el = document.getElementById('count');
  el.textContent = fmt(count);
  el.className = '';
  el.classList.add('bump');
  setTimeout(() => el.classList.remove('bump'), 180);

  if (peak===null || count>peak) peak = count;
  document.getElementById('s-peak').textContent = fmt(peak);

  const dEl = document.getElementById('delta');
  if (prev!==null && count!==prev) {
    const diff = count - prev;
    const type = diff>0 ? 'gain' : 'loss';
    dEl.className = type;
    dEl.textContent = diff>0 ? `▲ +${fmt(diff)} subscriber${Math.abs(diff)>1?'s':''}` : `▼ ${fmt(diff)} subscriber${Math.abs(diff)>1?'s':''}`;
    if (diff>0) gained+=diff; else lost+=Math.abs(diff);
    document.getElementById('s-gain').textContent = `+${fmt(gained)}`;
    document.getElementById('s-lost').textContent = `−${fmt(lost)}`;
    toast(type, diff);
    addRipple(diff>0 ? 'rgba(57,255,154,0.7)' : 'rgba(255,80,80,0.7)');
    for(let i=0;i<Math.min(Math.abs(diff),8);i++) setTimeout(()=>spawnParticle(diff),i*150);
  } else if (prev===null) {
    dEl.className='neutral';
    dEl.textContent='— just loaded —';
  }
  prev = count;
}

/* ── PROGRESS BAR ── */
function animBar() {
  const bar = document.getElementById('pbar');
  bar.style.transition = 'none';
  bar.style.transform  = 'scaleX(1)';
  bar.offsetHeight; // reflow
  bar.style.transition = `transform ${INTERVAL/1000}s linear`;
  bar.style.transform  = 'scaleX(0)';
}

/* ── FETCH (no API key) ── */
async function fetchCount() {
  /* Source 1: socialcounts.org */
  try {
    const r = await fetch(`https://api.socialcounts.org/youtube-live-subscriber-count/${CHANNEL_ID}`);
    const d = await r.json();
    if (d?.est_sub != null) { updateUI(d.est_sub); return; }
  } catch(_) {}

  /* Source 2: yt.lemnoslife.com (no-key proxy) */
  try {
    const r = await fetch(`https://yt.lemnoslife.com/noKey/channels?part=statistics&id=${CHANNEL_ID}`);
    const d = await r.json();
    const n = parseInt(d?.items?.[0]?.statistics?.subscriberCount, 10);
    if (!isNaN(n)) { updateUI(n); return; }
  } catch(_) {}

  /* All sources failed */
  const el = document.getElementById('count');
  el.textContent = 'API Unavailable';
  el.className = 'error';
  document.getElementById('delta').className = 'neutral';
  document.getElementById('delta').textContent = '— check connection —';
}

/* ── INIT ── */
fetchCount(); animBar();
setInterval(() => { fetchCount(); animBar(); }, INTERVAL);
</script>
</body>
</html>

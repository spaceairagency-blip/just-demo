<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADIK'S CHANNEL REMOVAL PARTY</title>
    <style>
        :root {
            --primary: #ff4757;
            --accent: #ffa502;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism Card */
        .container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            max-width: 500px;
            z-index: 10;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 2rem;
        }

        /* The Stats / "Work" Logs */
        .stats {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 2rem;
            font-family: 'Courier New', Courier, monospace;
            text-align: left;
        }

        .stats p {
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .highlight { color: var(--accent); }

        /* Party Button */
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--primary);
        }

        /* Confetti Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="container">
        <h1>🎉 Sadik's Channel Removal Party</h1>
        <p class="subtitle">Celebrating the end of the "Copy-Paste" Era</p>

        <div class="stats">
            <p>> [LOG]: Detecting original content... <span class="highlight">0% Found</span></p>
            <p>> [LOG]: Right-click usage: <span class="highlight">OVERLOAD</span></p>
            <p>> [LOG]: Status: <span style="color: #2ecc71;">Party Invitations Sent</span></p>
        </div>

        <p>Warning: Uploading copied videos may result in more parties like this.</p>
        <button onclick="startParty()">Click for Party Mode</button>
    </div>

    <script>
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 10 + 5;
                this.speed = Math.random() * 3 + 2;
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                this.angle = Math.random() * 360;
            }

            update() {
                this.y += this.speed;
                this.angle += 1;
                if (this.y > canvas.height) this.y = -20;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function startParty() {
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>

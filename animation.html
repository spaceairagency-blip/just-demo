<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SADIK'S CHANNEL REMOVAL PARTY</title>
    <style>
        :root {
            --primary: #ff4757;
            --accent: #ffa502;
            --bg: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Confetti Canvas Background */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Container */
        .card {
            position: relative;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        /* Console Log / Roast Box */
        .terminal {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .line { margin: 4px 0; }
        .line span { color: var(--accent); }

        /* The Button Area */
        .btn-container {
            margin-top: 20px;
        }

        .danger-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        .danger-btn:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(255, 65, 108, 0.6);
        }

        .danger-btn:disabled {
            background: #444;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Progress Bar Area */
        #removalStatus {
            display: none;
            margin-top: 25px;
        }

        .progress-track {
            height: 8px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #2ecc71;
            transition: width 0.1s linear;
        }

        #statusText {
            font-size: 0.8rem;
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>
<body>

    <canvas id="confetti"></canvas>

    <div class="card">
        <h1>CHANNEL REMOVAL</h1>
        <p class="subtitle">Official Party for "Video Relocator" Sadik</p>

        <div class="terminal">
            <div class="line">> [INFO]: Target Found: <span>Sadik's Channel</span></div>
            <div class="line">> [INFO]: Original Content: <span>0.00%</span></div>
            <div class="line">> [INFO]: Work Method: <span>Copy/Paste</span></div>
            <div class="line">> [STATUS]: <span>Ready to Party</span></div>
        </div>

        <div class="btn-container">
            <button class="danger-btn" id="mainBtn" onclick="startRemoval()">
                Terminate Channel & Start Party
            </button>
        </div>

        <div id="removalStatus">
            <div class="progress-track">
                <div id="progressFill"></div>
            </div>
            <p id="statusText">Scanning for copied videos...</p>
        </div>
    </div>

    <script>
        // --- Confetti Logic ---
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height - canvas.height;
                this.size = Math.random() * 8 + 4;
                this.speed = Math.random() * 4 + 2;
                this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
                this.angle = Math.random() * 360;
            }
            update() {
                this.y += this.speed;
                this.angle += 2;
                if (this.y > canvas.height) this.y = -20;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle * Math.PI / 180);
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function triggerConfetti() {
            particles = [];
            for (let i = 0; i < 120; i++) particles.push(new Particle());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                animationId = requestAnimationFrame(animate);
            }
            animate();
        }

        // --- Removal Logic ---
        function startRemoval() {
            const btn = document.getElementById('mainBtn');
            const statusDiv = document.getElementById('removalStatus');
            const fill = document.getElementById('progressFill');
            const text = document.getElementById('statusText');

            btn.disabled = true;
            btn.innerText = "Processing...";
            statusDiv.style.display = 'block';

            let progress = 0;
            const messages = [
                "Locating 'Download' folder...",
                "Filtering out copied shorts...",
                "Contacting Copyright Bot...",
                "Deleting Sadik's upload button...",
                "Sending Party Invitations...",
                "CHANNEL REMOVED!"
            ];

            const timer = setInterval(() => {
                progress += 1;
                fill.style.width = progress + "%";
                
                if (progress % 20 === 0) {
                    text.innerText = messages[Math.floor(progress / 20)];
                }

                if (progress >= 100) {
                    clearInterval(timer);
                    text.style.color = "#ff4757";
                    text.style.fontWeight = "bold";
                    text.innerText = "SUCCESS: Channel Deleted. Enjoy the party!";
                    triggerConfetti();
                }
            }, 60);
        }
    </script>
</body>
</html>
